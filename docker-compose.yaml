# Hostinger VPS – deploy ecom.aikuznia.cloud
# Użyj tego URL w VPS_createNewProjectV1 po pushu na GitHub
services:
  ecom:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        VITE_N8N_WEBHOOK_URL: https://n8n.sztukaautomatyzacji.pl/webhook/ecommerce-quiz
        VITE_LLM_PROXY_URL: https://n8n.sztukaautomatyzacji.pl/webhook/ecommerce-llm-proxy
        VITE_TIDYCAL_PATH: sztukamarketingu/darmowa-sesja-doradcza
        VITE_APP_TITLE: Diagnoza E-commerce
        VITE_REPORT_LANGUAGE: pl
        VITE_REPORT_ONLY_MODE: "true"
    restart: unless-stopped
    networks:
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ecom.rule=Host(`ecom.aikuznia.cloud`)"
      - "traefik.http.routers.ecom.entrypoints=websecure"
      - "traefik.http.routers.ecom.tls=true"
      - "traefik.http.routers.ecom.tls.certresolver=mytlschallenge"
      - "traefik.http.services.ecom.loadbalancer.server.port=80"
      - "traefik.docker.network=root_default"

networks:
  root_default:
    external: true
