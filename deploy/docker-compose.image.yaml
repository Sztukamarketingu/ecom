# Wersja z image: – dla Hostinger Docker Manager (bez build na VPS)
# Obraz: ghcr.io/Sztukamarketingu/ecom:latest (GHCR = github.repository)
# Port w kontenerze: 80 (nginx)
services:
  ecom:
    image: ghcr.io/sztukamarketingu/ecom:latest
    restart: unless-stopped
    networks:
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ecom.rule=Host(`ecom.aikuznia.cloud`)"
      - "traefik.http.routers.ecom.entrypoints=websecure"
      - "traefik.http.routers.ecom.tls=true"
      - "traefik.http.routers.ecom.tls.certresolver=mytlschallenge"
      - "traefik.http.services.ecom.loadbalancer.server.port=80"
      - "traefik.docker.network=root_default"

networks:
  root_default:
    external: true
