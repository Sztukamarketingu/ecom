# Konfiguracja na serwerze hosta (np. /etc/nginx/sites-available/ecom)
# Subdomena: ecom.aikuznia.cloud
#
# 1. Skopiuj do: sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/ecom
# 2. Link: sudo ln -sf /etc/nginx/sites-available/ecom /etc/nginx/sites-enabled/
# 3. Test: sudo nginx -t
# 4. Reload: sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name ecom.aikuznia.cloud;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

