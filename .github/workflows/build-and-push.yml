name: Build and push to ghcr.io

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_N8N_WEBHOOK_URL=https://n8n.sztukaautomatyzacji.pl/webhook/ecommerce-quiz
            VITE_LLM_PROXY_URL=https://n8n.sztukaautomatyzacji.pl/webhook/ecommerce-llm-proxy
            VITE_TIDYCAL_PATH=sztukamarketingu/darmowa-sesja-doradcza
            VITE_APP_TITLE=Diagnoza E-commerce
            VITE_REPORT_LANGUAGE=pl
            VITE_REPORT_ONLY_MODE=true

      - name: Set package visibility to public
        continue-on-error: true
        run: |
          curl -sL -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/ecom \
            -d '{"visibility":"public"}'
