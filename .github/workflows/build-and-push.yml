name: Build and push to Docker Hub

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ecom
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_N8N_WEBHOOK_URL=https://n8n.sztukaautomatyzacji.pl/webhook/ecommerce-quiz
            VITE_LLM_PROXY_URL=https://n8n.sztukaautomatyzacji.pl/webhook/ecommerce-llm-proxy
            VITE_TIDYCAL_PATH=sztukamarketingu/darmowa-sesja-doradcza
            VITE_APP_TITLE=Diagnoza E-commerce
            VITE_REPORT_LANGUAGE=pl
            VITE_REPORT_ONLY_MODE=true
